<title id="ttl">CommentHide — open-source Facebook comment moderation</title>
<desc id="dsc">Social card: the CommentHide wordmark, the tagline 'Self-hosted Facebook comment moderation on Cloudflare Workers', and four proof points — a real rule engine, dry run before anything is hidden, your own Cloudflare account, MIT licensed.</desc>
