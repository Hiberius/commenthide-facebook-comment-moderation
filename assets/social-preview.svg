 stop-color="#fb923c" stop-opacity="0.1"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient><filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/></filter><filter id="blurA" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="26"/></filter><filter id="soften1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.9"/></filter><filter id="soften2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0.4 0.4 0.4 0 -0.16"/></filter><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#5eead4"/></marker><marker id="ar-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#818cf8"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#c084fc"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#34d399"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#fbbf24"/></marker><marker id="ar-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#8f9bb8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#e8ecf7"/></marker><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="424" y1="160" x2="634" y2="240"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#818cf8"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect width="1280" height="640" fill="url(#bg)"/><g filter="url(#blurA)"><ellipse cx="160" cy="60" rx="460" ry="320" fill="url(#au0)"/><ellipse cx="660" cy="660" rx="620" ry="340" fill="url(#au1)"/><ellipse cx="1180" cy="90" rx="460" ry="340" fill="url(#au2)"/><ellipse cx="1050" cy="560" rx="380" ry="260" fill="url(#au3)"/></g><g font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"><g opacity="0.5"><rect x="830" y="84" width="300" height="56" rx="16" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="831" y="85" width="298" height="30.8" rx="15" fill="url(#gloss)"/><circle cx="856" cy="112" r="11" fill="#5eead4" opacity="0.5"/><rect x="880" y="100" width="102" height="7" rx="3.5" fill="#e8ecf7" opacity="0.55"/><rect x="880" y="115" width="186" height="6" rx="3" fill="#8f9bb8" opacity="0.45"/><rect x="880" y="127" width="120" height="6" rx="3" fill="#8f9bb8" opacity="0.3"/></g><g opacity="0.4"><rect x="830" y="152" width="300" height="56" rx="16" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="831" y="153" width="298" height="30.8" rx="15" fill="url(#gloss)"/><circle cx="856" cy="180" r="11" fill="#818cf8" opacity="0.5"/><rect x="880" y="168" width="102" height="7" rx="3.5" fill="#e8ecf7" opacity="0.55"/><rect x="880" y="183" width="186" height="6" rx="3" fill="#8f9bb8" opacity="0.45"/><rect x="880" y="195" width="120" height="6" rx="3" fill="#8f9bb8" opacity="0.3"/></g><g opacity="0.3" filter="url(#soften1)"><rect x="848" y="226" width="300" height="56" rx="16" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="849" y="227" width="298" height="30.8" rx="15" fill="url(#gloss)"/><circle cx="874" cy="254" r="11" fill="#c084fc" opacity="0.5"/><rect x="898" y="242" width="102" height="7" rx="3.5" fill="#e8ecf7" opacity="0.55"/><rect x="898" y="257" width="186" height="6" rx="3" fill="#8f9bb8" opacity="0.45"/><rect x="898" y="269" width="120" height="6" rx="3" fill="#8f9bb8" opacity="0.3"/></g><rect x="788" y="210" width="524" height="122" rx="26" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1.2" opacity="0.92"/><rect x="789" y="211" width="522" height="76" rx="25" fill="url(#sheen)"/><rect x="100" y="108" width="171.2" height="28" rx="14" fill="url(#glass2)" stroke="url(#edge)" stroke-width="1"/><circle cx="113" cy="122" r="3" fill="#5eead4"/><text x="125" y="125.7" font-size="10.5" fill="#5eead4" font-weight="500">OPEN SOURCE · SELF-HOSTED</text><text x="100" y="234" font-size="86" font-weight="700" letter-spacing="-2.8" fill="#e8ecf7">Comment<tspan fill="url(#brand)">Hide</tspan></text><text x="100" y="282" font-size="22" fill="#8f9bb8">Self-hosted Facebook comment moderation on Cloudflare Workers</text><rect x="100" y="322" width="660" height="1" fill="url(#hair)"/><rect x="100" y="356" width="258" height="144" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="101" y="357" width="256" height="79.2" rx="17" fill="url(#gloss)"/><circle cx="122" cy="388" r="3.5" fill="#5eead4"/><text x="134" y="392" font-size="9.5" fill="#5eead4" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.1">RULES</text><text x="120" y="424" font-size="18" fill="#e8ecf7" font-weight="600" letter-spacing="-0.3">Rule engine, not a</text><text x="120" y="447" font-size="18" fill="#e8ecf7" font-weight="600" letter-spacing="-0.3">blunt switch</text><text x="120" y="472" font-size="11.5" fill="#8f9bb8">Seven kinds, priority order,</text><text x="120" y="487" font-size="11.5" fill="#8f9bb8">first match wins.</text><rect x="374" y="356" width="258" height="144" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="375" y="357" width="256" height="79.2" rx="17" fill="url(#gloss)"/><circle cx="396" cy="388" r="3.5" fill="#fbbf24"/><text x="408" y="392" font-size="9.5" fill="#fbbf24" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.1">SAFE</text><text x="394" y="424" font-size="18" fill="#e8ecf7" font-weight="600" letter-spacing="-0.3">Dry run before</text><text x="394" y="447" font-size="18" fill="#e8ecf7" font-weight="600" letter-spacing="-0.3">anything is hidden</text><text x="394" y="472" font-size="11.5" fill="#8f9bb8">Every verdict is written down</text><text x="394" y="487" font-size="11.5" fill="#8f9bb8">before a single write goes out.</text><rect x="648" y="356" width="258" height="144" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="649" y="357" width="256" height="79.2" rx="17" fill="url(#gloss)"/><circle cx="670" cy="388" r="3.5" fill="#818cf8"/><text x="682" y="392" font-size="9.5" fill="#818cf8" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.1">SELF-HOSTED</text><text x="668" y="424" font-size="18" fill="#e8ecf7" font-weight="600" letter-spacing="-0.3">Your Cloudflare</text><text x="668" y="447" font-size="18" fill="#e8ecf7" font-weight="600" letter-spacing="-0.3">account, your data</text><text x="668" y="472" font-size="11.5" fill="#8f9bb8">Workers + D1. No third party</text><text x="668" y="487" font-size="11.5" fill="#8f9bb8">sits in the path.</text><rect x="922" y="356" width="258" height="144" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="923" y="357" width="256" height="79.2" rx="17" fill="url(#gloss)"/><circle cx="944" cy="388" r="3.5" fill="#c084fc"/><text x="956" y="392" font-size="9.5" fill="#c084fc" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.1">OPEN</text><text x="942" y="424" font-size="18" fill="#e8ecf7" font-weight="600" letter-spacing="-0.3">MIT licensed</text><text x="942" y="472" font-size="11.5" fill="#8f9bb8">Read it, fork it, run it.</text><text x="942" y="487" font-size="11.5" fill="#8f9bb8">No lock-in, no upsell.</text><text x="100" y="552" font-size="12.5" fill="#6b7794">Cloudflare Workers · D1 · Meta Graph API · cron every minute</text></g><rect width="1280" height="640" fill="#808080" filter="url(#grain)" opacity="0.1"/></svg>
