<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="ttl dsc">
<title id="ttl">CommentHide rule engine</title>
<desc id="dsc">The decision flow for a single comment: skip it if the ledger already has it, keep it if an allow rule matches, otherwise evaluate the rule set in priority order. The verdict is hide, flag or keep; a hide verdict in dry-run mode records the decision without touching Facebook. Every outcome is written to D1 with the rule that decided it.</desc>
