oke="#54607a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-dim)"/><rect x="470" y="466" width="300" height="68" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="471" y="467" width="298" height="37.4" rx="17" fill="url(#gloss)"/><rect x="484" y="482" width="3" height="36" rx="1.5" fill="#b45309" opacity="0.9"/><text x="498" y="492" font-size="15" fill="#101a2e" font-weight="600">Ledger only</text><text x="498" y="509" font-size="11" fill="#54607a">nothing is hidden — the verdict is still written</text><path d="M770 410 C800 410, 800 430, 822 430" fill="none" stroke="#4f46e5" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-indigo)"/><path d="M770 500 C800 500, 800 466, 822 466" fill="none" stroke="#4f46e5" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-indigo)"/><rect x="830" y="396" width="314" height="104" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="831" y="397" width="312" height="57.2" rx="17" fill="url(#gloss)"/><rect x="844" y="412" width="3" height="72" rx="1.5" fill="#4f46e5" opacity="0.9"/><text x="858" y="422" font-size="16" fill="#101a2e" font-weight="600">Recorded in D1</text><text x="858" y="439" font-size="11" fill="#54607a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">comment_id · status · dry_run</text><text x="858" y="454" font-size="11" fill="#54607a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">matched_rule_id · matched_reason</text><text x="858" y="469" font-size="11" fill="#54607a">the ledger that makes the next run idempotent</text><text x="830" y="524" font-size="11.5" fill="#54607a">Nothing is hidden without a rule id and a reason</text><text x="830" y="540" font-size="11.5" fill="#54607a">written down next to it.</text></g><rect width="1200" height="560" fill="#808080" filter="url(#grain)" opacity="0.1"/></svg>
