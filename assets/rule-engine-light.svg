172" font-size="10" fill="#54607a">a URL or a bare domain</text><rect x="828" y="184" width="300" height="24" rx="12" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="0.8"/><circle cx="843" cy="196" r="3" fill="#0d9488"/><text x="854" y="200" font-size="10.5" fill="#101a2e" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">contact</text><text x="946" y="200" font-size="10" fill="#54607a">phone, email or @handle</text><rect x="828" y="212" width="300" height="24" rx="12" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="0.8"/><circle cx="843" cy="224" r="3" fill="#b45309"/><text x="854" y="228" font-size="10.5" fill="#101a2e" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">emoji_spam</text><text x="946" y="228" font-size="10" fill="#54607a">emoji count at or over N</text><rect x="828" y="240" width="300" height="24" rx="12" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="0.8"/><circle cx="843" cy="252" r="3" fill="#4f46e5"/><text x="854" y="256" font-size="10.5" fill="#101a2e" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">min_length</text><text x="946" y="256" font-size="10" fill="#54607a">shorter than N characters</text><rect x="828" y="268" width="300" height="24" rx="12" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="0.8"/><circle cx="843" cy="280" r="3" fill="#047857"/><text x="854" y="284" font-size="10.5" fill="#101a2e" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">author_allow</text><text x="946" y="284" font-size="10" fill="#54607a">pair with action: allow</text><path d="M824 112 C770 112, 740 230, 704 348" fill="none" stroke="#54607a" stroke-width="1" opacity="0.4"/><path d="M824 140 C770 140, 740 244, 704 348" fill="none" stroke="#54607a" stroke-width="1" opacity="0.4"/><path d="M824 168 C770 168, 740 258, 704 348" fill="none" stroke="#54607a" stroke-width="1" 