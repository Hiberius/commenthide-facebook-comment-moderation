<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="ttl dsc">
<title id="ttl">CommentHide architecture</title>
<desc id="dsc">A cron trigger wakes the Cloudflare Worker every minute. The Worker asks the Meta Graph API for comments, passes each unseen one to the rule engine, and either hides it through the Graph API or records the decision only. Cloudflare D1 stores posts, rules, the comment ledger and the audit events. The dashboard talks to the Worker over HTTPS.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="0.5" stop-color="#fdf6ea"/><stop offset="1" stop-color="#f7eeda"/></linearGradient><linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/></linearGradient><linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="1" stop-color="#1e293b" stop-opacity="0.2"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><linearGradient id="hair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e293b" stop-opacity="0"/><stop offset="0.5" stop-color="#1e293b" stop-opacity="0.2"/><stop offset="1" stop-color="#1e293b" stop-opacity="0"/></linearGradient><radialGradient id="au0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.2"/><stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.1"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient><radialGradient id="au1"><stop offset="0" stop-color="#6366f1" stop-opacity="0.2"/><stop offset="0.5" stop-color="#6366f1" stop-opacity="0.1"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient><radialGradient id="au2"><stop offset="0" stop-color="#a855f7" stop-opacity="0.2"/><stop offset="0.5" stop-color="#a855f7" stop-opacity="0.1"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient><radialGradient id="au3"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.3"/><stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.1"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient><filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4a4034" flood-opacity="0.1"/></filter><filter id="blurA" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="26"/></filter><filter id="soften1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.9"/></filter><filter id="soften2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0 0.2  0.4 0.4 0.4 0 -0.16"/></filter><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#0d9488"/></marker><marker id="ar-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#4f46e5"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#7c3aed"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#047857"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#b45309"/></marker><marker id="ar-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#54607a"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.6 1.4 L9.2 5 L0.6 8.6 Z" fill="#101a2e"/></marker></defs><rect width="1200" height="620" fill="url(#bg)"/><g filter="url(#blurA)"><ellipse cx="120" cy="90" rx="420" ry="300" fill="url(#au0)"/><ellipse cx="600" cy="330" rx="560" ry="340" fill="url(#au1)"/><ellipse cx="1120" cy="140" rx="420" ry="320" fill="url(#au2)"/><ellipse cx="300" cy="600" rx="420" ry="260" fill="url(#au3)"/></g><g font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"><text x="56" y="62" font-size="19" fill="#101a2e" font-weight="600" letter-spacing="-0.3">CommentHide</text><text x="56" y="84" font-size="11.5" fill="#54607a">how a comment becomes a decision</text><path d="M900 56 L942 56" fill="none" stroke="#54607a" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ar-dim)" opacity="0.8"/><text x="952" y="60" font-size="11" fill="#54607a">live path</text><path d="M900 84 L942 84" fill="none" stroke="#b45309" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ar-warn)" stroke-dasharray="5 4" opacity="0.9"/><text x="952" y="88" font-size="11" fill="#54607a">dry run — nothing is hidden</text><rect x="460" y="28" width="280" height="72" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="461" y="29" width="278" height="39.6" rx="17" fill="url(#gloss)"/><rect x="474" y="44" width="3" height="40" rx="1.5" fill="#7c3aed" opacity="0.9"/><text x="488" y="54" font-size="15" fill="#101a2e" font-weight="600">Dashboard</text><text x="488" y="71" font-size="11" fill="#54607a">one HTML document · session cookie + CSRF</text><rect x="460" y="140" width="280" height="112" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="461" y="141" width="278" height="61.6" rx="17" fill="url(#gloss)"/><rect x="474" y="156" width="3" height="80" rx="1.5" fill="#0d9488" opacity="0.9"/><text x="488" y="166" font-size="17" fill="#101a2e" font-weight="600">Worker</text><text x="488" y="183" font-size="11" fill="#54607a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">poller — runPoll(env)</text><text x="488" y="198" font-size="11" fill="#54607a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">scheduled() + fetch()</text><text x="488" y="213" font-size="11" fill="#54607a">reads posts, rules and seen ids</text><rect x="56" y="154" width="250" height="84" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="57" y="155" width="248" height="46.2" rx="17" fill="url(#gloss)"/><rect x="70" y="170" width="3" height="52" rx="1.5" fill="#0d9488" opacity="0.9"/><text x="84" y="180" font-size="15" fill="#101a2e" font-weight="600">Cron Trigger</text><text x="84" y="197" font-size="11" fill="#54607a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">* * * * *  ·  every minute</text><rect x="900" y="140" width="244" height="112" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="901" y="141" width="242" height="61.6" rx="17" fill="url(#gloss)"/><rect x="914" y="156" width="3" height="80" rx="1.5" fill="#4f46e5" opacity="0.9"/><text x="928" y="166" font-size="16" fill="#101a2e" font-weight="600">Meta Graph API</text><text x="928" y="183" font-size="11" fill="#54607a">v25.0 · Page access token</text><text x="928" y="198" font-size="11" fill="#54607a">read comments</text><text x="928" y="213" font-size="11" fill="#54607a">write is_hidden</text><rect x="430" y="292" width="340" height="104" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="431" y="293" width="338" height="57.2" rx="17" fill="url(#gloss)"/><rect x="444" y="308" width="3" height="72" rx="1.5" fill="#7c3aed" opacity="0.9"/><text x="458" y="318" font-size="17" fill="#101a2e" font-weight="600">Rule engine</text><text x="458" y="335" font-size="11" fill="#54607a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">evaluate(comment, rules, mode)</text><text x="458" y="350" font-size="11" fill="#54607a">pure — no I/O, no network</text><text x="458" y="365" font-size="11" fill="#54607a">priority order · first match wins</text><rect x="828" y="430" width="316" height="88" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="829" y="431" width="314" height="48.4" rx="17" fill="url(#gloss)"/><rect x="842" y="446" width="3" height="56" rx="1.5" fill="#047857" opacity="0.9"/><text x="856" y="456" font-size="15" fill="#101a2e" font-weight="600">Hide on Facebook</text><text x="856" y="473" font-size="11" fill="#54607a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /{comment_id}  is_hidden=true</text><text x="856" y="488" font-size="11" fill="#54607a">status: hidden</text><rect x="56" y="430" width="316" height="88" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="57" y="431" width="314" height="48.4" rx="17" fill="url(#gloss)"/><rect x="70" y="446" width="3" height="56" rx="1.5" fill="#b45309" opacity="0.9"/><text x="84" y="456" font-size="15" fill="#101a2e" font-weight="600">Ledger only</text><text x="84" y="473" font-size="11" fill="#54607a">no Graph write, ever</text><text x="84" y="488" font-size="11" fill="#54607a">dry run · flag · keep</text><rect x="56" y="540" width="1088" height="56" rx="18" fill="url(#glassFill)" stroke="url(#edge)" stroke-width="1" filter="url(#soft)"/><rect x="57" y="541" width="1086" height="30.8" rx="17" fill="url(#gloss)"/><rect x="70" y="556" width="3" height="24" rx="1.5" fill="#4f46e5"/><text x="84" y="566" font-size="15" fill="#101a2e" font-weight="600">Cloudflare D1</text><text x="84" y="583" font-size="10.5" fill="#54607a">your account, your database</text><rect x="700" y="555" width="51.5" height="26" rx="13" fill="url(#glass2)" stroke="url(#edge)" stroke-width="1"/><text x="710" y="571.7" font-size="10.5" fill="#54607a" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">posts</text><rect x="759.5" y="555" width="51.5" height="26" rx="13" fill="url(#glass2)" stroke="url(#edge)" stroke-width="1"/><text x="769.5" y="571.7" font-size="10.5" fill="#54607a" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rules</text><rect x="819" y="555" width="127.1" height="26" rx="13" fill="url(#glass2)" stroke="url(#edge)" stroke-width="1"/><text x="829" y="571.7" font-size="10.5" fill="#54607a" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">comments — ledger</text><rect x="954.1" y="555" width="108.2" height="26" rx="13" fill="url(#glass2)" stroke="url(#edge)" stroke-width="1"/><text x="964.1" y="571.7" font-size="10.5" fill="#54607a" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">events — audit</text><path d="M306 196 L452 196" fill="none" stroke="#0d9488" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-teal)"/><rect x="340.6" y="174.3" width="76.9" height="18.5" rx="9.2" fill="#fffdf8" opacity="0.9"/><text x="379" y="186" font-size="10.5" fill="#54607a" font-weight="500" text-anchor="middle">every minute</text><path d="M600 100 L600 132" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-violet)"/><rect x="610" y="109.3" width="87.7" height="18.5" rx="9.2" fill="#fffdf8" opacity="0.9"/><text x="616" y="121" font-size="10.5" fill="#54607a" font-weight="500">HTTPS · /api/*</text><path d="M740 172 L892 172" fill="none" stroke="#0d9488" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-teal)"/><rect x="750" y="151.7" width="132" height="18" rx="9" fill="#fffdf8" opacity="0.9"/><text x="816" y="163" font-size="10" fill="#54607a" font-weight="500" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GET /{post}/comments</text><path d="M900 224 L748 224" fill="none" stroke="#4f46e5" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-indigo)"/><rect x="761" y="229.7" width="126" height="18" rx="9" fill="#fffdf8" opacity="0.9"/><text x="824" y="241" font-size="10" fill="#54607a" font-weight="500" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">comments · can_hide</text><path d="M600 252 L600 284" fill="none" stroke="#0d9488" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-teal)"/><rect x="608" y="261.3" width="114.7" height="18.5" rx="9.2" fill="#fffdf8" opacity="0.9"/><text x="614" y="273" font-size="10.5" fill="#54607a" font-weight="500">each unseen comment</text><path d="M600 538 L600 404" fill="none" stroke="#4f46e5" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-indigo)" opacity="0.9"/><rect x="608" y="454.3" width="87.7" height="18.5" rx="9.2" fill="#fffdf8" opacity="0.9"/><text x="614" y="466" font-size="10.5" fill="#54607a" font-weight="500">enabled rules,</text><rect x="608" y="470.3" width="103.9" height="18.5" rx="9.2" fill="#fffdf8" opacity="0.9"/><text x="614" y="482" font-size="10.5" fill="#54607a" font-weight="500">in priority order</text><path d="M770 344 C792 344, 796 452, 820 452" fill="none" stroke="#047857" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-ok)"/><rect x="788" y="388.3" width="82.3" height="18.5" rx="9.2" fill="#fffdf8" opacity="0.9"/><text x="794" y="400" font-size="10.5" fill="#047857" font-weight="500">verdict: hide</text><path d="M430 344 C408 344, 404 452, 380 452" fill="none" stroke="#b45309" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-warn)" stroke-dasharray="5 4"/><rect x="286.4" y="388.3" width="125.6" height="18.5" rx="9.2" fill="#fffdf8" opacity="0.9"/><text x="406" y="400" font-size="10.5" fill="#b45309" font-weight="500" text-anchor="end">dry run · flag · keep</text><path d="M1060 430 L1060 260" fill="none" stroke="#047857" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-ok)"/><rect x="950" y="318.7" width="102" height="18" rx="9" fill="#fffdf8" opacity="0.9"/><text x="1046" y="330" font-size="10" fill="#047857" font-weight="500" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /{comment}</text><rect x="956" y="334.7" width="96" height="18" rx="9" fill="#fffdf8" opacity="0.9"/><text x="1046" y="346" font-size="10" fill="#047857" font-weight="500" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">is_hidden=true</text><path d="M940 518 L940 534" fill="none" stroke="#4f46e5" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-indigo)"/><rect x="948" y="519.3" width="93.1" height="18.5" rx="9.2" fill="#fffdf8" opacity="0.9"/><text x="954" y="531" font-size="10.5" fill="#54607a" font-weight="500">hidden + reason</text><path d="M200 518 L200 534" fill="none" stroke="#4f46e5" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-indigo)"/><rect x="208" y="519.3" width="103.9" height="18.5" rx="9.2" fill="#fffdf8" opacity="0.9"/><text x="214" y="531" font-size="10.5" fill="#54607a" font-weight="500">decision + reason</text></g><rect width="1200" height="620" fill="#808080" filter="url(#grain)" opacity="0.1"/></svg>
